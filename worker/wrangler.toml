name = "spillwatch-assistant"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
ALLOWED_ORIGINS = "https://mahum24.github.io"

# 20 model calls per visitor per minute (one question is usually 2-3 calls).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Start the GitHub Actions workflows on time (see SCHEDULE in src/index.js). Needs the
# GITHUB_TOKEN secret: a fine-grained token with "Actions: read and write" on this repo only.
[triggers]
crons = ["7,22,37,52 * * * *", "12 * * * *"]

# Secrets are never in this file:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put GITHUB_TOKEN
